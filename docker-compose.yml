services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: arenasports
      POSTGRES_USER: arenasports
      POSTGRES_PASSWORD: arenasports
    ports:
      - '5432:5432'
    volumes:
      - arenasports_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arenasports -d arenasports']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - arenasports_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arenasports_postgres:
  arenasports_redis:
