name: Bug report
description: Report a reproducible ArenaSports defect without private data.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, tokens, identity documents, private evidence, or exploit details.
        Security vulnerabilities must be reported privately according to SECURITY.md.
  - type: textarea
    id: impact
    attributes:
      label: User impact
      description: Who is affected and what cannot they do?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Tap...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App/API version or commit
  - type: dropdown
    id: integrity
    attributes:
      label: Does this affect results, standings, evidence, permissions, or disputes?
      options:
        - 'No'
        - 'Yes'
        - 'Unsure'
    validations:
      required: true
