name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: arenasports
          POSTGRES_USER: arenasports
          POSTGRES_PASSWORD: arenasports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenasports -d arenasports"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://arenasports:arenasports@localhost:5432/arenasports?schema=public
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
      ENABLE_DEMO_AUTH: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Commit pinned formatting
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/as-02-identity-sessions'
        run: |
          pnpm format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Format mobile authentication flow"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Validate Prisma schema
        run: pnpm --filter @arenasports/database db:validate

      - name: Deploy database migrations
        run: pnpm --filter @arenasports/database db:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test compiled API
        run: |
          pnpm --filter @arenasports/api start > /tmp/arenasports-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4000/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/arenasports-api.log
          exit 1
