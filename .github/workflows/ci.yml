name: CI

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: arenasports
          POSTGRES_USER: arenasports
          POSTGRES_PASSWORD: arenasports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenasports -d arenasports"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://arenasports:arenasports@localhost:5432/arenasports?schema=public
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
      ENABLE_DEMO_AUTH: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Preserve generated lockfile
        uses: actions/upload-artifact@v6
        with:
          name: pnpm-lock-${{ github.run_id }}
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1

      - name: Check formatting
        run: pnpm format:check

      - name: Validate Prisma schema
        run: pnpm --filter @arenasports/database db:validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
