name: Inspect AS-04 import overlay

on:
  pull_request:
    branches:
      - agent/as-03-game-profiles

permissions:
  contents: read

jobs:
  inspect:
    if: github.head_ref == 'agent/as-04-tournament-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/as-04-tournament-lifecycle
      - name: Capture overlay checksums
        run: |
          {
            sha256sum scripts/as04-importfix-0.b64 scripts/as04-importfix-1.b64
            wc -c scripts/as04-importfix-0.b64 scripts/as04-importfix-1.b64
          } > import-checksums.txt
          cat import-checksums.txt
      - name: Upload checksum report
        uses: actions/upload-artifact@v7
        with:
          name: as04-import-checksums
          path: import-checksums.txt
          retention-days: 1
