name: Apply AS-04 implementation

on:
  pull_request:
    branches:
      - agent/as-03-game-profiles

permissions:
  contents: write

concurrency:
  group: apply-as04-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/as-04-tournament-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: arenasports
          POSTGRES_USER: arenasports
          POSTGRES_PASSWORD: arenasports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenasports -d arenasports"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://arenasports:arenasports@localhost:5432/arenasports?schema=public
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: silent
      ENABLE_DEMO_AUTH: 'false'

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/as-04-tournament-lifecycle
          fetch-depth: 0

      - name: Capture transfer chunks
        uses: actions/upload-artifact@v7
        with:
          name: as04-transfer-chunks
          path: scripts/as04-patch-*.b64
          retention-days: 1

      - name: Reconstruct and verify implementation bundle
        run: |
          echo "b99e136a72dbbc29f0055e788650588c2f9d395ebfd0dd2657da0f0eee822bad  scripts/as04-patch-00.b64" | sha256sum --check --strict
          echo "2a815f4bf4213257ab03d5dd853d16ce522192d6a0800d399726185afdcf73fd  scripts/as04-patch-01.b64" | sha256sum --check --strict
          echo "3b5b7f873350c871ebb94011d17ecba8ecca552b54340da0e232d60a09e9f49f  scripts/as04-patch-02.b64" | sha256sum --check --strict
          echo "d992ef589aaab641e999b620d5610a260f74bb68f4ab3d30cdacba8ffe23f754  scripts/as04-patch-03.b64" | sha256sum --check --strict
          cat scripts/as04-patch-00.b64 scripts/as04-patch-01.b64 scripts/as04-patch-02.b64 scripts/as04-patch-03.b64 > /tmp/as04-changes.tar.gz.b64
          base64 --decode /tmp/as04-changes.tar.gz.b64 > /tmp/as04-changes.tar.gz
          echo "cf1758a4217d41cb8f850fe262a8339c244398d5930687c246df78da77c297e0  /tmp/as04-changes.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/as04-changes.tar.gz
          rm scripts/as04-patch-00.b64 scripts/as04-patch-01.b64 scripts/as04-patch-02.b64 scripts/as04-patch-03.b64
          rm .github/workflows/as04-source-snapshot.yml

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply pinned formatting
        run: pnpm format

      - name: Check formatting
        run: pnpm format:check

      - name: Validate Prisma schema
        run: pnpm --filter @arenasports/database db:validate

      - name: Deploy database migrations from zero
        run: pnpm --filter @arenasports/database db:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke test compiled API
        run: |
          pnpm --filter @arenasports/api start > /tmp/arenasports-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4000/health/live > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/arenasports-api.log
          exit 1

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement AS-04 tournament lifecycle"
          git push origin HEAD:agent/as-04-tournament-lifecycle
