name: Extract AS-04 test failures

on:
  pull_request:
    branches:
      - agent/as-03-game-profiles

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.head_ref == 'agent/as-04-tournament-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download failed validation log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/89797367299/logs" \
            --output failed-job.log
          grep -n -E "FAIL|AssertionError|Error:|expected|Received|Tests? |Test Files|Failed" failed-job.log > test-failures.txt || true
          tail -n 350 failed-job.log > failed-job-tail.log
          cat test-failures.txt

      - name: Upload extracted test diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: as04-test-failures
          path: |
            test-failures.txt
            failed-job-tail.log
          retention-days: 1
