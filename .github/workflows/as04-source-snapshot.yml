name: Extract AS-04 typecheck errors

on:
  pull_request:
    branches:
      - agent/as-03-game-profiles

permissions:
  actions: read
  contents: read

jobs:
  extract:
    if: github.head_ref == 'agent/as-04-tournament-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download failed job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/89796329382/logs" \
            --output failed-job.log
          file failed-job.log
          grep -E "error TS[0-9]+|ERR_PNPM|ELIFECYCLE|Failed$" failed-job.log > typecheck-errors.txt || true
          cat typecheck-errors.txt

      - name: Upload extracted diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: as04-typecheck-errors-pass-2
          path: |
            typecheck-errors.txt
            failed-job.log
          retention-days: 1
